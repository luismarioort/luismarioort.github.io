            <!--
              To add a photo: put the file in assets/photos/ and copy one
              <figure> block. Change the file name in BOTH places (href and src),
              write a short description in alt (for screen readers), and a
              caption. Photos fill the left column first, then the right,
              in the order you list them. Nothing gets cropped.
            -->
            <div class="gallery">
              <figure>
                <a href="assets/photos/photo-1.jpg">
                  <img src="assets/photos/photo-1.jpg" alt="Describe what the photo shows" loading="lazy" decoding="async" />
                </a>
                <figcaption>Zipolite, Oaxaca</figcaption>
              </figure>

              <figure>
